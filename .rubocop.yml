require:
  - rubocop-performance
  - "test_prof/rubocop"
  - rubocop-rspec
  - rubocop-packaging

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 125
  AllowedPatterns: ['\A#']

Style/SuperArguments:
  Enabled: false
