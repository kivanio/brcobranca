require:
  - rubocop-performance
  - "test_prof/rubocop"
  - rubocop-rspec
  - rubocop-packaging

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: single_quotes

Layout/LineLength:
  Max: 125
  AllowedPatterns: ['\A#']
  Exclude:
    - "lib/brcobranca/boleto/template/*.rb"

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "lib/brcobranca/boleto/template/*.rb"

Metrics/AbcSize:
  Max: 20
  Exclude:
    - "lib/brcobranca/boleto/template/*.rb"

Metrics/ModuleLength:
  Exclude:
    - "lib/brcobranca/boleto/template/*.rb"

Metrics/ClassLength:
  Exclude:
    - "lib/brcobranca/boleto/template/*.rb"

Style/SuperArguments:
  Enabled: false

RSpec/ContextWording:
  Enabled: true
  Prefixes:
    - quando
    - com
    - sem

RSpec/MultipleExpectations:
  Enabled: true
  Max: 10

RSpec/ExampleLength:
  Enabled: true
  Max: 25
